bio: |
  I am a Ph.D. student in Operations, Information, and Technology at the Stanford Graduate School of Business and a Data Science Scholar at Stanford Human-Centered AI.

  I study the intersection of economics, operations, and AI. My research uses game theory, mechanism design, and information design to improve human–AI collaboration and decision-making. I received my B.S. in Mathematics with highest honor from the School of the Gifted Young at the University of Science and Technology of China.
