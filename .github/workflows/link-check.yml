name: Check links manually

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 6 --timeout 30 --max-retries 2
            --base https://yifan2003.github.io/
            --accept '100..=103,200..=299,401,403,429'
            --exclude '^mailto:'
            'content/**/*.md' 'data/**/*.json' 'data/**/*.yaml'
          output: ./lychee/report.md
          fail: true
      - name: Save link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: ./lychee/report.md
          retention-days: 7
